<div data-lift="surround?with=default;at=content">
  <div id="confirm-bg-payment-request" style="width: 90%; margin: 0 auto;">
    <div class="form-group">
      <div data-lift="ConfirmPaymentRequest.render">
      </div>
    </div>

    <style>
      /* Общие стили для всего контента */
      .payment-details {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        font-family: 'Arial', sans-serif;
      }

      /* Заголовок */
      .transaction-title {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-bottom: 20px;
      }

      /* Стили для каждого ряда */
      .data-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
      }

      /* Стили для лейблов (наименований) */
      .data-row strong {
        font-size: 16px;
        color: #888; /* Серый цвет для наименований */
      }

      /* Стили для значений */
      .value {
        font-size: 16px;
        font-weight: bold;
        color: #333; /* Темный цвет для значений */
      }

      /* Контейнер для списка IBAN */
      .toggle-container {
        margin: 15px 0;
      }

      /* Подпись над списком */
      .toggle-container p {
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
      }

      /* Каждая строка с радиокнопкой */
      .toggle-container label {
        display: flex;
        align-items: center;       /* выравниваем радиокнопку и текст по центру */
        cursor: pointer;
        font-size: 14px;
        color: #333;               /* тёмный текст по умолчанию */
        margin-bottom: 8px;
        transition: font-weight 0.2s, color 0.2s;
      }

      /* Радиокнопка */
      .toggle-container input[type="radio"] {
        margin-right: 10px;
        vertical-align: middle;
        cursor: pointer;
      }

      /* При наведении */
      .toggle-container label:hover {
        font-weight: bold;          /* делаем текст жирным */
        color: #000;                /* меняем цвет на черный */
      }

      /* Значок выбранного IBAN */
      .toggle-container input[type="radio"]:checked + .toggle-label {
        font-weight: bold;           /* текст выбранного IBAN тоже жирный */
        color: #000;
      }

      /* Контейнер для кнопок подтверждения */
      .button-container {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
      }


      /* Кнопки */
      .btn {
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      .btn-warning {
        background-color: #f0ad4e;
        color: white;
        border: none;
      }

      .btn-success {
        background-color: #5bc0de;
        color: white;
        border: none;
      }

      /* Контейнер для кнопок */
      .button-container {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
      }

      /* Для сообщения об ошибке или информации */
      .alert-info {
        background-color: #e7f5ff;
        border: 1px solid #c7e3f7;
        padding: 15px;
        text-align: center;
        border-radius: 5px;
        color: #3178c6;
        font-weight: bold;
      }

    </style>

  </div>
</div>
