  - changeSet:
      id: create-table-file_t
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: file_t
      comment: >-
        A stored file's metadata: owner, size, digest, media type and virus-scan status. The content is in filecontent.
      changes:
        - createTable:
            tableName: file_t
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: fileid, type: VARCHAR(36)}
              - column: {name: bankid, type: VARCHAR(255)}
              - column: {name: userid, type: VARCHAR(255)}
              - column: {name: scanstatusupdatedat, type: TIMESTAMP}
              - column: {name: scanstatusupdatedbyuserid, type: VARCHAR(255)}
              - column: {name: sha256, type: VARCHAR(64)}
              - column: {name: sizeinbytes, type: BIGINT}
              - column: {name: mediatype, type: VARCHAR(100)}
              - column: {name: filename, type: VARCHAR(255)}
              - column: {name: onbehalfofuserid, type: VARCHAR(255)}
              - column: {name: ispublic, type: BOOLEAN}
              - column: {name: createdat, type: TIMESTAMP}
              - column: {name: ispersonal, type: BOOLEAN}
              - column: {name: scanstatus, type: VARCHAR(20)}
              - column: {name: scanstatusreason, type: VARCHAR(1000)}

  - changeSet:
      id: create-indexes-file_t
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: file_t_bankid_fileid
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: file_t
            indexName: file_t_bankid_fileid
            columns:
              - column: {name: bankid}
              - column: {name: fileid}
        - createIndex:
            tableName: file_t
            indexName: file_t_fileid
            unique: true
            columns:
              - column: {name: fileid}

  - changeSet:
      id: create-table-fileaccess
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: fileaccess
      comment: >-
        A user other than the owner who may read a file.
      changes:
        - createTable:
            tableName: fileaccess
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: fileid, type: VARCHAR(36)}
              - column: {name: onbehalfofuserid, type: VARCHAR(255)}
              - column: {name: createdat, type: TIMESTAMP}
              - column: {name: granteeuserid, type: VARCHAR(255)}
              - column: {name: grantedbyuserid, type: VARCHAR(255)}

  - changeSet:
      id: create-indexes-fileaccess
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: fileaccess_fileid_granteeuserid
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: fileaccess
            indexName: fileaccess_fileid_granteeuserid
            unique: true
            columns:
              - column: {name: fileid}
              - column: {name: granteeuserid}
        - createIndex:
            tableName: fileaccess
            indexName: fileaccess_granteeuserid
            columns:
              - column: {name: granteeuserid}

  - changeSet:
      id: create-table-fileattachment
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: fileattachment
      comment: >-
        A file attached to a record (a Dynamic Entity record, a customer, an account ...).
      changes:
        - createTable:
            tableName: fileattachment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: fileid, type: VARCHAR(36)}
              - column: {name: bankid, type: VARCHAR(255)}
              - column: {name: userid, type: VARCHAR(255)}
              - column: {name: onbehalfofuserid, type: VARCHAR(255)}
              - column: {name: createdat, type: TIMESTAMP}
              - column: {name: fileattachmentid, type: VARCHAR(36)}
              - column: {name: recordtype, type: VARCHAR(255)}
              - column: {name: recordid, type: VARCHAR(255)}

  - changeSet:
      id: create-indexes-fileattachment
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: fileattachment_bankid_recordtype_recordid
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: fileattachment
            indexName: fileattachment_bankid_recordtype_recordid
            columns:
              - column: {name: bankid}
              - column: {name: recordtype}
              - column: {name: recordid}
        - createIndex:
            tableName: fileattachment
            indexName: fileattachment_fileattachmentid
            unique: true
            columns:
              - column: {name: fileattachmentid}
        - createIndex:
            tableName: fileattachment
            indexName: fileattachment_fileid_recordtype_recordid
            unique: true
            columns:
              - column: {name: fileid}
              - column: {name: recordtype}
              - column: {name: recordid}

  - changeSet:
      id: create-table-filecontent
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: filecontent
      comment: >-
        The bytes of a stored file, kept apart from its metadata so listing files never reads them.
      changes:
        - createTable:
            tableName: filecontent
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: fileid, type: VARCHAR(36)}
              - column: {name: content, type: "${blob.type}"}

  - changeSet:
      id: create-indexes-filecontent
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: filecontent_fileid
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: filecontent
            indexName: filecontent_fileid
            unique: true
            columns:
              - column: {name: fileid}

  - changeSet:
      id: create-table-groupmembership
      author: obp
      preConditions:
        - onFail: MARK_RAN
