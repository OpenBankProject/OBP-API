                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: consumer_id, type: VARCHAR(250)}
              - column: {name: account_id, type: VARCHAR(255)}
              - column: {name: view_id, type: VARCHAR(255)}
              - column: {name: bank_id, type: VARCHAR(255)}
              - column: {name: granted_by_user_id, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP}
              - column: {name: updated_at, type: TIMESTAMP}
              - column: {name: consumer_account_access_id, type: VARCHAR(36)}

  - changeSet:
      id: create-indexes-consumer_account_access
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
