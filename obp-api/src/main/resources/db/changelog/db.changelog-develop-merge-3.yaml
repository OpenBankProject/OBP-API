              - column: {name: retentionpolicyid, type: VARCHAR(36)}
              - column: {name: resourcetype, type: VARCHAR(64)}
              - column: {name: retentionarchiveid, type: VARCHAR(36)}
              - column: {name: resourceid, type: VARCHAR(255)}
              - column: {name: deleteafter, type: TIMESTAMP}
              - column: {name: retentionrunid, type: VARCHAR(36)}
              - column: {name: owneruserid, type: VARCHAR(255)}
              - column: {name: parentresourcetype, type: VARCHAR(64)}
              - column: {name: parentresourceid, type: VARCHAR(255)}
              - column: {name: jsoncopy, type: "${text.type}"}
              - column: {name: hascontent, type: BOOLEAN}
              - column: {name: contentsizeinbytes, type: BIGINT}
              - column: {name: archivedat, type: TIMESTAMP}
