            indexName: consumer_account_access_consumer_id_bank_id_account_id_view_id
            unique: true
            columns:
              - column: {name: consumer_id}
              - column: {name: bank_id}
              - column: {name: account_id}
              - column: {name: view_id}

  - changeSet:
      id: create-table-domain_api
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: domain_api
      comment: >-
        A Domain API: a base path under which a bank publishes its own URL shapes, rewritten to OBP endpoints.
      changes:
        - createTable:
            tableName: domain_api
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: created_by_user_id, type: VARCHAR(255)}
              - column: {name: description, type: VARCHAR(2000)}
              - column: {name: bank_id, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP}
              - column: {name: domain_api_id, type: VARCHAR(36)}
              - column: {name: base_path, type: VARCHAR(255)}
              - column: {name: is_publicly_discoverable, type: BOOLEAN}
              - column: {name: updated_at, type: TIMESTAMP}
              - column: {name: title, type: VARCHAR(255)}
              - column: {name: version, type: VARCHAR(50)}

  - changeSet:
      id: create-indexes-domain_api
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: domain_api_bank_id
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: domain_api
            indexName: domain_api_bank_id
            columns:
              - column: {name: bank_id}
        - createIndex:
            tableName: domain_api
            indexName: domain_api_base_path
            unique: true
            columns:
              - column: {name: base_path}
        - createIndex:
            tableName: domain_api
            indexName: domain_api_domain_api_id
            unique: true
            columns:
              - column: {name: domain_api_id}

  - changeSet:
      id: create-table-dynamic_entity_webhook
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: dynamic_entity_webhook
      comment: >-
        A webhook on a Dynamic Entity: the URL called when records of the entity are created, updated or deleted.
      changes:
        - createTable:
            tableName: dynamic_entity_webhook
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: entity_name, type: VARCHAR(255)}
              - column: {name: is_active, type: BOOLEAN}
              - column: {name: created_by_user_id, type: VARCHAR(255)}
              - column: {name: description, type: VARCHAR(2000)}
              - column: {name: webhook_id, type: VARCHAR(36)}
              - column: {name: url, type: VARCHAR(1024)}
              - column: {name: created_by_on_behalf_of_user_id, type: VARCHAR(255)}
              - column: {name: events, type: VARCHAR(64)}
              - column: {name: field_conditions, type: "${text.type}"}
              - column: {name: deactivated_reason, type: VARCHAR(64)}
              - column: {name: bank_id, type: VARCHAR(255)}
              - column: {name: dynamic_entity_id, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP}
