databaseChangeLog:
  # Schema for the features the third origin/develop merge brought in (develop up to db74dd46e).
  #
  # Upstream creates these through Lift's Schemifier; this branch has none, so every table, column
  # and index the ported Doobie stores rely on is declared here. The definitions were taken from
  # the schema Schemifier itself built for upstream, at the merge base and at the merged commit, on
  # Postgres, and diffed - not transcribed from the entity declarations.
  #
  # Each changeset guards itself with tableExists / indexExists / columnExists / a width check, so a
  # database that already has the object records the changeset as run instead of aborting the boot.

  - changeSet:
      id: create-table-account_creation
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: account_creation
      comment: >-
        Who created each account (the caller and the user it acted for, and the consent if one was used), recorded when the account is created.
      changes:
        - createTable:
            tableName: account_creation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: created_by_user_id, type: VARCHAR(255)}
              - column: {name: account_id, type: VARCHAR(255)}
              - column: {name: created_by_on_behalf_of_user_id, type: VARCHAR(255)}
              - column: {name: consent_reference_id, type: VARCHAR(255)}
              - column: {name: bank_id, type: VARCHAR(255)}
              - column: {name: created_at, type: TIMESTAMP}

  - changeSet:
      id: create-indexes-account_creation
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: account_creation_bank_id_account_id
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: account_creation
            indexName: account_creation_bank_id_account_id
            unique: true
            columns:
              - column: {name: bank_id}
              - column: {name: account_id}

  - changeSet:
      id: create-table-asset
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: asset
      comment: >-
        An asset a bank issues (a token, a stablecoin or a security), with its code, chain identifiers and lifecycle status.
      changes:
        - createTable:
            tableName: asset
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: createdbyuserid, type: VARCHAR(255)}
              - column: {name: creationdate, type: TIMESTAMP}
              - column: {name: lastupdate, type: TIMESTAMP}
              - column: {name: assetcode, type: VARCHAR(10)}
              - column: {name: assetid, type: VARCHAR(36)}
              - column: {name: issuerbankid, type: VARCHAR(255)}
              - column: {name: assettype, type: VARCHAR(32)}
              - column: {name: decimalplaces, type: INTEGER}
              - column: {name: issuerproductcode, type: VARCHAR(50)}
              - column: {name: chainscheme, type: VARCHAR(64)}
              - column: {name: chainassetid, type: VARCHAR(255)}
              - column: {name: dti, type: VARCHAR(9)}
              - column: {name: status, type: VARCHAR(16)}
              - column: {name: name, type: VARCHAR(125)}

  - changeSet:
      id: create-indexes-asset
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: asset_assetcode
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: asset
            indexName: asset_assetcode
            unique: true
            columns:
              - column: {name: assetcode}
        - createIndex:
            tableName: asset
            indexName: asset_assetid
            unique: true
            columns:
              - column: {name: assetid}
        - createIndex:
            tableName: asset
            indexName: asset_issuerbankid
            columns:
              - column: {name: issuerbankid}

  - changeSet:
      id: create-table-assetstatushistory
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: assetstatushistory
      comment: >-
        Each lifecycle status change of an asset, who made it and why.
      changes:
        - createTable:
            tableName: assetstatushistory
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column: {name: fromstatus, type: VARCHAR(16)}
              - column: {name: tostatus, type: VARCHAR(16)}
              - column: {name: changedbyuserid, type: VARCHAR(255)}
              - column: {name: changedat, type: TIMESTAMP}
              - column: {name: assetid, type: VARCHAR(36)}
              - column: {name: reason, type: "${text.type}"}

  - changeSet:
      id: create-indexes-assetstatushistory
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: assetstatushistory_assetid
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: assetstatushistory
            indexName: assetstatushistory_assetid
            columns:
              - column: {name: assetid}

  - changeSet:
      id: create-table-consumer_account_access
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
