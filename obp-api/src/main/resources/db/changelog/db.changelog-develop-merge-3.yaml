  - changeSet:
      id: create-table-platform_app
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: platform_app
      comment: >-
        A Consumer declared to be a platform application, with the version it declared.
