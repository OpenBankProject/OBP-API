  - changeSet:
      id: create-table-retentionarchive
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: retentionarchive
      comment: >-
        A copy of a resource a retention run removed, kept until deleteafter.
      changes:
        - createTable:
            tableName: retentionarchive
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
