                indexName: consumer_account_access_bank_id_account_id
      comment: The indexes upstream's Schemifier built for the entity's dbIndexes.
      changes:
        - createIndex:
            tableName: consumer_account_access
            indexName: consumer_account_access_bank_id_account_id
            columns:
              - column: {name: bank_id}
              - column: {name: account_id}
        - createIndex:
            tableName: consumer_account_access
            indexName: consumer_account_access_consumer_account_access_id
            unique: true
            columns:
              - column: {name: consumer_account_access_id}
        - createIndex:
