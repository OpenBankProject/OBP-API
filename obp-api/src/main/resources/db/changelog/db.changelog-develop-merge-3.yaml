  # ── Columns and indexes the merged features add to existing tables ─────────────────────

  - changeSet:
      id: add-record-metadata-dynamicdata
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: dynamicdata
                columnName: createdat
      comment: >-
        When a Dynamic Entity record was created and last updated, and by whom: the user who made the call and the user it was made for, which differ only when an agent acted for somebody. Nullable: records saved before the columns existed hold NULL until they are next saved, and their creation time is never guessed.
      changes:
        - addColumn:
            tableName: dynamicdata
            columns:
              - column: {name: createdat, type: TIMESTAMP}
              - column: {name: updatedat, type: TIMESTAMP}
              - column: {name: createdbyuserid, type: VARCHAR(255)}
              - column: {name: createdbyonbehalfofuserid, type: VARCHAR(255)}
              - column: {name: updatedbyuserid, type: VARCHAR(255)}
              - column: {name: updatedbyonbehalfofuserid, type: VARCHAR(255)}

  - changeSet:
      id: add-lang-dynamicresourcedoc
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: dynamicresourcedoc
                columnName: lang
      comment: >-
        The source language of the endpoint body, Scala or Java. NULL on docs created before the column existed, which read back as Scala.
      changes:
        - addColumn:
            tableName: dynamicresourcedoc
            columns:
              - column: {name: lang, type: VARCHAR(50)}

  - changeSet:
      id: add-created-by-on-behalf-of-mappedcounterparty
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: mappedcounterparty
                columnName: mcreatedbyonbehalfofuserid
      comment: >-
        The user the creator of a counterparty acted for when a consent was involved, otherwise the creator again. An internal audit column; no response carries it.
      changes:
        - addColumn:
            tableName: mappedcounterparty
            columns:
              - column: {name: mcreatedbyonbehalfofuserid, type: VARCHAR(36)}

  - changeSet:
      id: add-bankid-mappeduserauthcontextupdate
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: mappeduserauthcontextupdate
                columnName: bankid
      comment: >-
        The bank a user auth context update was requested at; its answer is accepted at that bank only. NULL on updates requested before the column existed, which no bank accepts.
      changes:
        - addColumn:
            tableName: mappeduserauthcontextupdate
            columns:
              - column: {name: bankid, type: VARCHAR(255)}

  - changeSet:
      id: add-forwarded-for-domain-api-url-metric
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: metric
                columnName: forwarded_for
      comment: >-
        The hops a request passed through (the X-Forwarded-For chain followed by the TCP peer), and the path a caller used under a Domain API before it was rewritten to the OBP URL in url.
      changes:
        - addColumn:
            tableName: metric
            columns:
              - column: {name: forwarded_for, type: VARCHAR(512)}
              - column: {name: domain_api_url, type: VARCHAR(2000)}

  - changeSet:
      id: add-forwarded-for-domain-api-url-metricarchive
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: metricarchive
                columnName: forwarded_for
      comment: >-
        The archive copy of the two metric columns of the same name, at the same widths, so the archiver can copy every row.
      changes:
        - addColumn:
            tableName: metricarchive
            columns:
              - column: {name: forwarded_for, type: VARCHAR(512)}
              - column: {name: domain_api_url, type: VARCHAR(2000)}

  - changeSet:
      id: add-consumerid-signingbasket
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: signingbasket
                columnName: consumerid
      comment: >-
        The consumer (TPP) that created a signing basket. NULL on baskets created before it was recorded.
      changes:
        - addColumn:
            tableName: signingbasket
            columns:
              - column: {name: consumerid, type: VARCHAR(255)}

  - changeSet:
      id: widen-dynamicdata-dynamicdataid
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 0
                sql: >-
                  SELECT COUNT(*) FROM information_schema.columns
                  WHERE LOWER(table_name) = 'dynamicdata' AND LOWER(column_name) = 'dynamicdataid'
                  AND character_maximum_length = 36
      comment: >-
        A caller may supply a record id itself, which is how a Dynamic Entity gets a natural key such as
        a country code or a scheme name, so the id is not always a UUID and can exceed 36 characters.
        255 is the width of the two other columns holding the same id (dynamicdataaccess.dynamicdataid
        and the projection tables' data_id). The precondition counts the columns still at 36, so a
        database already widened marks this run.
      changes:
        - modifyDataType:
            tableName: dynamicdata
            columnName: dynamicdataid
            newDataType: VARCHAR(255)

  - changeSet:
      id: create-index-dynamicdata_bankid_dynamicentityname_dynamicdataid
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: dynamicdata_bankid_dynamicentityname_dynamicdataid
      comment: >-
        A record id is unique within one space and one entity, not across the instance: two spaces may each hold a record whose natural key is DE. Supersedes dynamicdata_dynamicdataid, which db.changelog-dynamic-entity-space.yaml drops.
      changes:
        - createIndex:
            tableName: dynamicdata
            indexName: dynamicdata_bankid_dynamicentityname_dynamicdataid
            unique: true
            columns:
              - column: {name: bankid}
              - column: {name: dynamicentityname}
              - column: {name: dynamicdataid}

  - changeSet:
      id: create-index-dynamicdataaccess_bankid_entityname_dynamicdataid_userid
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: dynamicdataaccess_bankid_entityname_dynamicdataid_userid
      comment: >-
        One access row per (space, entity, record, user), with the same discriminators as the record index. Supersedes dynamicdataaccess_dynamicdataid_userid.
      changes:
        - createIndex:
            tableName: dynamicdataaccess
            indexName: dynamicdataaccess_bankid_entityname_dynamicdataid_userid
            unique: true
            columns:
              - column: {name: bankid}
              - column: {name: entityname}
              - column: {name: dynamicdataid}
              - column: {name: userid}

  - changeSet:
      id: create-index-dynamicresourcedoc_bankid_requesturl_requestverb
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: dynamicresourcedoc_bankid_requesturl_requestverb
      comment: >-
        A verb and URL are unique within one space, not across spaces. Supersedes dynamicresourcedoc_requesturl_requestverb.
      changes:
        - createIndex:
            tableName: dynamicresourcedoc
            indexName: dynamicresourcedoc_bankid_requesturl_requestverb
            unique: true
            columns:
              - column: {name: bankid}
              - column: {name: requesturl}
              - column: {name: requestverb}

  - changeSet:
      id: create-index-message_outbox_target_id
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: message_outbox_target_id
      comment: >-
        Webhook deliveries are listed and counted per webhook, which is the target id of a WEBHOOK row.
      changes:
        - createIndex:
            tableName: message_outbox
            indexName: message_outbox_target_id
            columns:
              - column: {name: target_id}

  - changeSet:
      id: create-index-token_key_c
      author: obp
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: token_key_c
      comment: >-
        Every authenticated request looks its token up by key, so without this each request scanned the whole table. Not unique, so a database that already holds a duplicate key still starts.
      changes:
        - createIndex:
            tableName: token
            indexName: token_key_c
            columns:
              - column: {name: key_c}

