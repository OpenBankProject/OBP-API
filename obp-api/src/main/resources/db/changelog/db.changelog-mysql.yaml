# The indexes MySQL cannot build as the other databases do.
#
# InnoDB caps an index key at 3072 bytes, and utf8mb4 counts four bytes per character, so an index
# over several VARCHAR(255) columns (or one long one) is refused with "Specified key was too long".
# The changesets that create these indexes elsewhere carry dbms: '!mysql', and this file builds the
# same indexes, under the same names, with a prefix length on the long columns.
#
# A unique index on a prefix is stricter than one on the whole value: two values that share their
# first N characters are treated as equal. The prefixes keep every key at 3072 bytes or less while
# leaving room for real identifiers, which are far shorter than the column widths.
#
# Every changeset is guarded by `not indexExists` with onFail: MARK_RAN, as the baseline's are.
databaseChangeLog:
  - changeSet:
      id: mysql-create-index-etag_etagresource
      author: obp
      dbms: mysql,mariadb
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: etag_etagresource
                tableName: etag
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX etag_etagresource ON etag (etagresource(768))
