                           ORDER BY id ASC) AS rn
                  FROM mapperaccountholders
                  WHERE user_c IS NOT NULL
                    AND accountbankpermalink IS NOT NULL
                    AND accountpermalink IS NOT NULL
                ) tmp WHERE rn > 1
              )
