  - changeSet:
      id: dedup-mappedentitlement
      author: obp
      comment: >-
        Collapses duplicates on mappedentitlement's (mbankid, muserid, mrolename) natural key before
        its unique index is created, keeping the lowest id.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: mappedentitlement
      changes:
        - sql:
            splitStatements: false
            sql: |-
              DELETE FROM mappedentitlement WHERE id IN (
                SELECT id FROM (
                  SELECT id, ROW_NUMBER() OVER (
                           PARTITION BY mbankid, muserid, mrolename ORDER BY id ASC) AS rn
                  FROM mappedentitlement
                  WHERE mbankid IS NOT NULL
                    AND muserid IS NOT NULL
                    AND mrolename IS NOT NULL
                ) tmp WHERE rn > 1
              )
  - changeSet:
      id: dedup-mapperaccountholders
      author: obp
