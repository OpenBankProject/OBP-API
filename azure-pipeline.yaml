name: $(Rev:r)

trigger:
  - main
  - master

variables:
- group: common   # здесь лежат секреты NEXUS_USER и NEXUS_PASS

resources:
  repositories:
    - repository: templates
      type: git
      name: DevOps/azure-templates

stages:
  - stage: BuildStage
    displayName: Build (Docker)
    jobs:
      - job: Build
        displayName: Build
        pool:
          name: Build
          demands: Agent.OS -equals Linux

        steps:
          # Получаем короткий хэш коммита
          - bash: echo "##vso[task.setvariable variable=shortCommit;isOutput=true]$(git rev-parse --short HEAD)"
            name: OutputVars
            displayName: Get - Short Commit

          # Логинимся в Docker Registry
          - task: Docker@2
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            displayName: Login - Docker
            inputs:
              command: login
              containerRegistry: DockerRegistryServiceConnection

          # Сборка Docker-образа с пробросом кредов в build-args
          - bash: |
              docker build \
                --build-arg NEXUS_USER=$(NEXUS_USER) \
                --build-arg NEXUS_PASS=$(NEXUS_PASS) \
                -t registry.maib.md/maib-obp-api:$(Build.SourceBranchName)-$(OutputVars.shortCommit) \
                -f $(Build.SourcesDirectory)/Dockerfile .
            displayName: Build - Image

          # Публикация образа
          - task: CmdLine@2
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            displayName: Push - Image
            inputs:
              script: docker push registry.maib.md/maib-obp-api:$(Build.SourceBranchName)-$(OutputVars.shortCommit)

          # Логаут из Docker Registry
          - task: Docker@2
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            displayName: Logout - Docker
            inputs:
              command: logout
              containerRegistry: DockerRegistryServiceConnection

          # Очистка локального образа
          - task: CmdLine@2
            displayName: Clean - Image
            inputs:
              script: docker rmi registry.maib.md/maib-obp-api:$(Build.SourceBranchName)-$(OutputVars.shortCommit)
