sonar.cpd.exclusions=obp-api/src/test/**/*.scala,obp-api/src/test/**/*.java

# JSON wire-format case classes (JSONFactory*) use snake_case field names by
# API contract — json4s serializes the field names verbatim, so renaming them
# to satisfy the scala naming rule (S117) would change the JSON on the wire.
sonar.issue.ignore.multicriteria=e1,c1,c2,c3,c4,c5,c6,c7,c8,c9,c10
sonar.issue.ignore.multicriteria.e1.ruleKey=scala:S117
sonar.issue.ignore.multicriteria.e1.resourceKey=**/JSONFactory*.scala

# Endpoints that only OBP versions below v5.1.0 can reach are commented out, not
# deleted, on purpose (see docs/OLD_VERSION_ONLY_CODE.md). Each block starts with
# THIS-CODE-IS-COMMENTED-OUT-BECAUSE-IT-IS-UNREACHABLE-IN-OBP-BEFORE-OBPv5.1.0.
# The commented-out-code rule (S125) is therefore not applied in the folders of
# those versions, main and test; every other rule still is.
sonar.issue.ignore.multicriteria.c1.ruleKey=scaladre:S125
sonar.issue.ignore.multicriteria.c1.resourceKey=obp-api/src/*/scala/code/api/v1_2_1/**
sonar.issue.ignore.multicriteria.c2.ruleKey=scaladre:S125
sonar.issue.ignore.multicriteria.c2.resourceKey=obp-api/src/*/scala/code/api/v1_3_0/**
sonar.issue.ignore.multicriteria.c3.ruleKey=scaladre:S125
sonar.issue.ignore.multicriteria.c3.resourceKey=obp-api/src/*/scala/code/api/v1_4_0/**
sonar.issue.ignore.multicriteria.c4.ruleKey=scaladre:S125
sonar.issue.ignore.multicriteria.c4.resourceKey=obp-api/src/*/scala/code/api/v2_0_0/**
