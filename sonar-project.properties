# WARNING: at least part of this file is not being applied. SonarCloud runs this project
# in Automatic Analysis mode (no scanner step in .github/workflows).
#
# What is proven: the test pattern below is NOT in effect. obp-api/src/test/**/*.scala has
# been listed here since long before the grpc entries were added, and API1_2_1Test.scala
# still reports 13.3% duplication in PR #91 - an excluded file would report 0. So adding
# the grpc patterns did not fix the new-code duplication gate, although the commit that
# added them (639133d1c) said it did.
#
# What is NOT proven: whether the grpc patterns are applied. Those files report 0-3%
# duplication, which is equally consistent with the exclusion working and with generated
# code that happens not to trip CPD. Do not cite them as evidence either way.
#
# To make exclusions take effect, either set Duplication Exclusions in the SonarCloud
# project settings (Administration > Analysis Scope), or add a scanner step to CI so
# this file is read. Until one of those happens, treat the list below as a statement of
# intent, not as configuration.
#
# The code/obp/grpc entries are scalapb-generated sources (regenerated by
# scripts/regenerate_grpc.sh, checked in by design): protobuf codegen is inherently
# repetitive, and counting it toward new-code duplication says nothing about
# hand-written code.
sonar.cpd.exclusions=obp-api/src/test/**/*.scala,obp-api/src/test/**/*.java,obp-api/src/main/scala/code/obp/grpc/api/**,obp-api/src/main/scala/code/obp/grpc/*/api/**

# JSON wire-format case classes (JSONFactory*) use snake_case field names by
# API contract — json4s serializes the field names verbatim, so renaming them
# to satisfy the scala naming rule (S117) would change the JSON on the wire.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=scala:S117
sonar.issue.ignore.multicriteria.e1.resourceKey=**/JSONFactory*.scala
